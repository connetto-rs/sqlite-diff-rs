[package]
name = "sqlite-diff-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sqlite-diff-rs = { path = "../", features = ["testing", "wal2json", "pg-walstream", "maxwell"] }
rusqlite = { version = "0.41", features = [
	"bundled",
	"session",
] }
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"

# Outside the parent workspace, whose release profile turns on fat LTO, and
# LTO drops the sanitizer coverage symbols the fuzz binaries link against.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false

[[bin]]
name = "sql_roundtrip"
path = "fuzz_targets/sql_roundtrip.rs"
test = false
doc = false

[[bin]]
name = "apply_roundtrip"
path = "fuzz_targets/apply_roundtrip.rs"
test = false
doc = false

[[bin]]
name = "reverse_idempotent"
path = "fuzz_targets/reverse_idempotent.rs"
test = false
doc = false

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false


[[bin]]
name = "wire_pg_walstream"
path = "fuzz_targets/wire_pg_walstream.rs"
test = false
doc = false

[[bin]]
name = "wire_wal2json"
path = "fuzz_targets/wire_wal2json.rs"
test = false
doc = false

[[bin]]
name = "wire_maxwell"
path = "fuzz_targets/wire_maxwell.rs"
test = false
doc = false

[[bin]]
name = "wire_pg_binary"
path = "fuzz_targets/wire_pg_binary.rs"
test = false
doc = false
